<!DOCTYPE html>
<html lang="zh-CN" data-brand="zhihu">
<head>
  <meta charset="UTF-8">
  <title>Zhihu to Markdown</title>
  <link rel="stylesheet" href="../lib/ui-v2.css">
  <link rel="stylesheet" href="../lib/series.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pop" id="pop">
    <header class="hd">
      <div class="logo"><img src="../icons/icon128.png" alt="" width="24" height="24"></div>
      <h1>Zhihu to Markdown</h1>
      <button id="settings-btn" class="icon-btn" aria-label="设置" title="设置">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <main class="body" id="body">
      <section id="article-info" class="card ctx" aria-label="当前页面">
        <span id="page-status" class="badge idle" role="status" aria-live="polite" aria-atomic="true"><span class="status-text">正在检测页面…</span></span>
        <div id="article-title" class="t">正在读取标题…</div>
        <div class="m"><span id="article-type">页面</span><span id="article-author-wrap" class="hidden"> · <span id="article-author">作者</span></span></div>
        <div id="progress" class="prog hidden"><div class="l"><span id="progress-text">正在导出…</span></div><div class="bar indeterminate" role="progressbar" aria-label="导出进度"><i></i></div></div>
      </section>

      <div id="error-message" class="card empty hidden">
        <div class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9.5 12.5 5 5m0-5-5 5"/></svg></div>
        <b class="empty-title">这个页面不支持导出</b><span class="empty-desc">请打开知乎的问题、回答、专栏文章、首页、关注或热榜页</span>
      </div>

      <div class="acts">
        <button id="export-btn" class="btn btn-primary" disabled aria-describedby="action-hint">
          <svg class="btn-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span class="spinner hidden" aria-hidden="true"></span><span class="label">导出 Markdown</span>
        </button>
        <button id="copy-btn" class="btn btn-secondary span-2" disabled aria-describedby="action-hint"><span class="label">复制 Markdown</span></button>
      </div>
      <small id="action-hint" class="sr-only">正在检测页面，完成后可导出</small>
      <div id="status-zone" class="status-zone">
        <div id="action-feedback" class="alert err hidden" role="alert">
          <svg id="feedback-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>
          <div><b id="feedback-title"></b><span id="feedback-hint"></span><span id="feedback-img" class="img-sub hidden"></span></div>
          <div class="x"><button id="feedback-open" class="btn btn-ghost btn-xs hidden">打开</button></div>
        </div>
        <div id="action-ok" class="alert ok hidden" role="status">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>
          <div><b>已保存</b><span id="ok-file"></span><span id="ok-kept" class="img-sub hidden"></span></div>
          <div class="x"><button id="open-btn" class="btn btn-ghost btn-xs">打开</button></div>
        </div>
        <div id="action-info" class="alert info hidden" role="status">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8v.5"/></svg>
          <div><span id="info-text">页面还在加载，加载完即可导出</span><span id="info-kept" class="sr-only hidden"></span></div>
          <div class="x"><button id="refresh-btn" class="btn btn-ghost btn-xs hidden">刷新页面</button></div>
        </div>
      </div>

      <div id="recent" class="recent hidden">
        <div class="sec-h"><span>最近导出</span></div>
        <div id="recent-list" class="card list"></div>
      </div>
    </main>

    <footer class="ft">
      <span id="shortcut-box"><span id="shortcut-prefix">快捷键</span> <kbd id="shortcut-kbd">Alt+Shift+K</kbd><span id="shortcut-guide" class="sc-guide hidden"></span></span>
      <span><span id="footer-version">v</span> · 右键菜单也能导出</span>
    </footer>
  </div>

  <script src="../lib/logger.js"></script>
  <script src="../lib/page-detector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
