name: Release

# 只在推送版本标签时运行；GitHub Release 只由这个工作流创建。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check tag matches package.json and manifest
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          MANIFEST="$(node -p 'require("./manifest.src.json").version')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
          test "${MANIFEST}" = "${VERSION}" || { echo "manifest ${MANIFEST} != package ${VERSION}"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      # build + build:firefox + verify:dist:chrome + verify:dist:firefox + zip + SHA256SUMS.txt
      - name: Build packages
        run: npm run package

      - name: Test
        run: |
          npm test
          npm run check:keys

      - name: Verify artifacts
        shell: bash
        run: |
          test -f "build/zhihu-md-v${VERSION}-chrome.zip"
          test -f "build/zhihu-md-v${VERSION}-firefox.zip"
          test -f "build/SHA256SUMS.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/zhihu-md-v${VERSION}-chrome.zip" \
            "build/zhihu-md-v${VERSION}-firefox.zip" \
            "build/SHA256SUMS.txt" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
