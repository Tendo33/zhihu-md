<!DOCTYPE html>
<html lang="zh-CN" data-brand="zhihu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhihu to Markdown 设置</title>
  <link rel="stylesheet" href="../lib/shared.css">
  <!-- 设计验收 R3：ui-v2 放在 shared 之后，同名 token（--surface/--border/--danger…）以 v2 为准 -->
  <link rel="stylesheet" href="../lib/ui-v2.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>设置</h1>
    </header>
    
    <main class="section">
      <div class="option-item">
        <div class="option-content">
          <label class="option-label" id="label-showFloatingBall" for="showFloatingBall">悬浮导出球</label>
          <div class="option-desc" id="desc-showFloatingBall"><span class="nw">在知乎首页、</span><span class="nw">关注、</span><span class="nw">热榜、</span><span class="nw">问题、</span><span class="nw">回答和专栏页</span><span class="nw">显示悬浮球：</span><span class="nw">点击下载，</span><span class="nw">右键复制。</span></div>
        </div>
        <span class="switch">
          <input type="checkbox" role="switch" id="showFloatingBall" aria-labelledby="label-showFloatingBall" aria-describedby="desc-showFloatingBall">
          <span class="slider" aria-hidden="true"></span>
        </span>
      </div>

      <div class="option-item option-item--field">
        <div class="option-content">
          <label class="option-label" id="label-maxAnswerCount" for="maxAnswerCount">最大下载条数</label>
          <div class="option-desc" id="desc-maxAnswerCount"><span class="nw">问题页回答和首页、</span><span class="nw">关注信息流通用。</span><span class="nw">填 0 则尽量全部下载，</span><span class="nw">最多 1000 条；</span><span class="nw">被上限截断的导出</span><span class="nw">会标注为已截断。</span></div>
        </div>
        <div class="field-col">
        <div class="num">
          <input type="number" id="maxAnswerCount" name="maxAnswerCount" min="0" max="1000" value="20" inputmode="numeric" autocomplete="off" class="number-input" aria-labelledby="label-maxAnswerCount" aria-describedby="desc-maxAnswerCount note-maxAnswerCount">
          <span class="num-unit" aria-hidden="true">条</span>
        </div>
        <div class="field-note" id="note-maxAnswerCount" role="status" aria-live="polite"></div>
        </div>
      </div>

      <div class="option-item">
        <div class="option-content">
          <label class="option-label" id="label-downloadImages" for="downloadImages">下载图片到本地</label>
          <div class="option-desc" id="desc-downloadImages"><span class="nw">把文章里的图片</span><span class="nw">一起保存，</span><span class="nw">导出为含 .md 和</span> <span class="nw">images 文件夹的</span> <span class="nw">ZIP 包；</span><span class="nw">关闭时图片</span><span class="nw">保留在线链接。</span></div>
        </div>
        <span class="switch">
          <input type="checkbox" role="switch" id="downloadImages" aria-labelledby="label-downloadImages" aria-describedby="desc-downloadImages">
          <span class="slider" aria-hidden="true"></span>
        </span>
      </div>
    </main>
    
    <footer class="footer">
      <span id="status" class="status-msg" role="status" aria-live="polite" aria-atomic="true"></span>
      <span class="ver">Zhihu to Markdown <span id="app-version"></span></span>
    </footer>
  </div>

  <script src="../lib/logger.js"></script>
  <script src="options.js"></script>
</body>
</html>
