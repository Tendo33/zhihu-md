<!DOCTYPE html>
<html lang="zh-CN" data-brand="zhihu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhihu to Markdown 设置</title>
  <link rel="stylesheet" href="../lib/shared.css">
  <!-- 设计验收 R3：ui-v2 放在 shared 之后，同名 token（--surface/--border/--danger…）以 v2 为准 -->
  <link rel="stylesheet" href="../lib/ui-v2.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>设置</h1>
    </header>
    
    <main class="section">
      <div class="option-item">
        <div class="option-content">
          <div class="option-label" id="label-showFloatingBall">悬浮导出球</div>
          <div class="option-desc" id="desc-showFloatingBall">在知乎首页、关注、热榜、问题、回答和专栏文章页显示导出悬浮球（点击下载，右键复制）。</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="showFloatingBall" aria-labelledby="label-showFloatingBall" aria-describedby="desc-showFloatingBall">
          <span class="slider"></span>
        </label>
      </div>

      <div class="option-item">
        <div class="option-content">
          <div class="option-label" id="label-maxAnswerCount">最大下载回答数</div>
          <div class="option-desc" id="desc-maxAnswerCount">问题页回答的下载上限。填 0 时尽量全部下载，最多 1000 条；没下完时文件会标 truncated。</div>
        </div>
        <input type="number" id="maxAnswerCount" name="maxAnswerCount" min="0" max="1000" value="20" inputmode="numeric" autocomplete="off" class="number-input" aria-labelledby="label-maxAnswerCount" aria-describedby="desc-maxAnswerCount">
      </div>

      <div class="option-item">
        <div class="option-content">
          <div class="option-label" id="label-downloadImages">下载图片到本地</div>
          <div class="option-desc" id="desc-downloadImages">将文章中的图片下载到本地，而非使用远程链接。导出时会创建包含 .md 文件和 images 文件夹的 ZIP 包。</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="downloadImages" aria-labelledby="label-downloadImages" aria-describedby="desc-downloadImages">
          <span class="slider"></span>
        </label>
      </div>
    </main>
    
    <footer class="footer">
      Zhihu to Markdown <span id="app-version"></span>
    </footer>
  </div>
  
  <div id="status" class="status-msg" role="status" aria-live="polite" aria-atomic="true">设置已保存</div>

  <script src="../lib/logger.js"></script>
  <script src="options.js"></script>
</body>
</html>
